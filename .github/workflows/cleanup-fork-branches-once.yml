name: Cleanup fork branches once

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'cleanup/remove-stale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Close temporary PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
      - name: Delete redundant branches
        shell: bash
        run: git push origin --delete 'willsito-tuning' 'cleanup/remove-stale' || true
